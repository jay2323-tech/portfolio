  "architectureSummary": "Telegram and a native macOS companion share a FastAPI backend. SQLite stores plans, memory and task events; BM25 retrieves project documents. LangGraph pauses proposals for approval, then a model-free executor applies approved changes in isolated Git worktrees.",
  "decisions": [
    {
      "title": "Bind approval to the exact change",
      "body": "Bind the proposal hash, canonical project root, target paths, branch and base commit before the approval pause. Recheck the baseline around execution so an approval cannot silently authorize a different proposal."
    },
    {
      "title": "Keep the working checkout separate",
      "body": "Apply changes in a dedicated review worktree and stage only approved paths. Check the commit parent and tree before reporting success. Retain failed or partial worktrees for inspection; do not automatically merge or switch the source checkout."
    },
    {
      "title": "Record outcomes without inventing verification",
      "body": "Typed per-change and batch receipts distinguish applied, refused, partial and failed outcomes. Failed batches do not feed success-memory extraction. Execution receipts explicitly say verified: false until an integrated verification gate exists."
    }
  ],
  "whatBroke": "The execution workflow needed a clearer distinction between a completed task and proven correctness. Typed receipts now preserve partial and failed outcomes, while the missing integrated test gate remains explicit. This is a documented reliability gap, not a claim of production readiness.",

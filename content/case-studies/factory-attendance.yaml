eyebrow: CASE STUDY · LIVE IN PRODUCTION
headline: Attendance, automated — facial recognition that has to work on a factory floor.
who: >-
  Built for a manufacturing site that needed reliable daily attendance without
  clipboard chaos or buddy-punching.
constraints:
  - Production environment — downtime is not a “we’ll fix it in staging” problem.
  - Varied lighting, queues at shift change, and workers who will not wait for a slow camera loop.
  - Must produce reports ops and payroll can actually use.
  - Solo delivery with a clear handoff path for on-site staff.
architectureSummary: >-
  Capture devices on the floor feed a recognition pipeline; verified punches
  land in a cloud attendance store; ops get daily reports and exception queues
  instead of spreadsheets. The hard part is not the model — it is the
  shift-change failure modes.
decisions:
  - title: Optimize for shift-change latency, not demo accuracy
    body: >-
      A 99% lab model that stalls a queue is a failed product. Tuned the
      capture → match loop for floor speed and clear retry UX when a face does
      not match cleanly.
  - title: Exception queues over silent auto-approve
    body: >-
      Ambiguous punches go to a human queue instead of inventing attendance.
      Slower on edge cases, honest with payroll.
  - title: Reports as a first-class surface
    body: >-
      Ops live in reports. Built attendance summaries and anomaly views early
      instead of bolting CSV export on at the end.
whatBroke: >-
  Lighting and angle changes at real entrances killed early match rates that
  looked fine in controlled tests. Had to redesign capture guidance and
  fallbacks (re-try, supervisor override) instead of blaming the model. Also
  learned that “live” means on-call for the first weeks of shift changes —
  documentation alone is not a handoff.

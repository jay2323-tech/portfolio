title: "DesiFit — DPDP context"
source: case-study
content: "India's DPDP Act shapes what DesiFit can collect, why, and for how long. Solo-built product decisions: every new field is a compliance liability. Users must understand consent in plain language. Prefer minimizing data over collect everything for later ML."
